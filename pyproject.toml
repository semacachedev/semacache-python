[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "semacache"
version = "0.1.0"
description = "Official Python SDK for semacache.io — semantic caching for LLM APIs"
readme = "README.md"
license = "MIT"
requires-python = ">=3.9"
authors = [{ name = "SemaCache", email = "dev@semacache.io" }]
keywords = ["llm", "cache", "semantic", "openai", "gpt", "gemini", "grok"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Libraries",
]
dependencies = ["httpx>=0.27.0"]

[project.urls]
Homepage = "https://semacache.io"
Documentation = "https://semacache.io/docs"
Repository = "https://github.com/semacachedev/semacache-python"
